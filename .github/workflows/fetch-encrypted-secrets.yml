name: Fetch or Create Build Configuration

on:
  workflow_call:
    inputs:
      zip_url_json:
        required: false
        type: string
        default: ''
      secrets_json_b64:
        description: Base64-encoded JSON configuration for unattended builds
        required: false
        type: string
        default: ''
      artifact_name:
        description: Unique configuration artifact name for this build target
        required: false
        type: string
        default: encrypted-secrets-zip

jobs:
  create-configuration:
    runs-on: ubuntu-latest
    steps:
      - name: Download encrypted configuration from RDGen
        if: ${{ inputs.secrets_json_b64 == '' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: python
          command: |
            import json
            import os
            import time
            import requests

            input_data = json.loads(os.environ['ZIP_URL_JSON'])
            url = f"{input_data['url']}/get_zip?filename={input_data['file']}"
            for attempt in range(5):
                try:
                    print(f"Downloading configuration (attempt {attempt + 1})...")
                    response = requests.get(url, timeout=20)
                    response.raise_for_status()
                    with open('secrets.zip', 'wb') as output:
                        output.write(response.content)
                    break
                except Exception:
                    if attempt == 4:
                        raise
                    time.sleep(5 * (2 ** attempt))
        env:
          ZIP_URL_JSON: ${{ inputs.zip_url_json }}

      - name: Create local configuration ZIP
        if: ${{ inputs.secrets_json_b64 != '' }}
        shell: python
        env:
          SECRETS_JSON_B64: ${{ inputs.secrets_json_b64 }}
        run: |
          import base64
          import json
          import os
          import zipfile

          raw = base64.b64decode(os.environ['SECRETS_JSON_B64'], validate=True)
          config = json.loads(raw)
          if not isinstance(config, dict) or not config:
              raise SystemExit('Build configuration must be a non-empty JSON object')
          if any(not isinstance(key, str) or not isinstance(value, str) for key, value in config.items()):
              raise SystemExit('Build configuration keys and values must all be strings')
          if any('\n' in value or '\r' in value for value in config.values()):
              raise SystemExit('Build configuration values cannot contain newlines')
          with zipfile.ZipFile('secrets.zip', 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              archive.writestr('secrets.json', json.dumps(config, separators=(',', ':')))
          print('Created local build configuration archive.')

      - name: Upload configuration artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: secrets.zip
          if-no-files-found: error
          retention-days: 2
