name: Build Windows x64 EXE and Android armv7 APK when RDGen supports a newer RustDesk client

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      rebuild_version:
        description: 'Optional one-time rebuild of a currently RDGen-supported version with no existing Release tag'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: rdgen-supported-client-release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    environment: rustdesk
    outputs:
      build_needed: ${{ steps.detect.outputs.build_needed }}
      version: ${{ steps.detect.outputs.version }}
      upstream_sha: ${{ steps.detect.outputs.upstream_sha }}
    steps:
      - name: Checkout fork scripts
        uses: actions/checkout@v4

      - name: Compare RDGen-supported versions with completed Releases
        id: detect
        run: |
          if [[ "$EVENT_TYPE" == "workflow_dispatch" && -n "$REBUILD_VERSION" ]]; then
            python3 .github/scripts/rdgen_release.py detect --manual-version "$REBUILD_VERSION"
          else
            python3 .github/scripts/rdgen_release.py detect
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_TYPE: ${{ github.event_name }}
          REBUILD_VERSION: ${{ inputs.rebuild_version }}
          RDGEN_BASELINE_VERSION: ${{ vars.RDGEN_BASELINE_VERSION }}

  config:
    needs: detect
    if: ${{ needs.detect.outputs.build_needed == 'true' }}
    runs-on: ubuntu-latest
    environment: rustdesk
    outputs:
      secrets_json_b64: ${{ steps.config.outputs.secrets_json_b64 }}
    steps:
      - name: Checkout fork scripts
        uses: actions/checkout@v4

      - name: Validate fixed environment and encode RDGen build config
        id: config
        run: python3 .github/scripts/rdgen_release.py config
        env:
          RUSTDESK_CLIENT_CONFIG_JSON_B64: ${{ secrets.RUSTDESK_CLIENT_CONFIG_JSON_B64 }}
          RUSTDESK_CUSTOM_CLIENT_SIGNING_PRIVATE_KEY: ${{ secrets.RUSTDESK_CUSTOM_CLIENT_SIGNING_PRIVATE_KEY }}

  build_windows_x64:
    needs: [detect, config]
    if: ${{ needs.detect.outputs.build_needed == 'true' }}
    uses: ./.github/workflows/generator-windows.yml
    with:
      version: ${{ needs.detect.outputs.version }}
      release_mode: true
      release_exe_only: true
      secrets_json_b64: ${{ needs.config.outputs.secrets_json_b64 }}
    secrets: inherit

  build_android:
    needs: [detect, config]
    if: ${{ needs.detect.outputs.build_needed == 'true' }}
    uses: ./.github/workflows/generator-android.yml
    with:
      version: ${{ needs.detect.outputs.version }}
      release_mode: true
      release_armv7_only: true
      secrets_json_b64: ${{ needs.config.outputs.secrets_json_b64 }}
    secrets: inherit

  publish_release:
    needs: [detect, build_windows_x64, build_android]
    if: ${{ needs.detect.outputs.build_needed == 'true' && needs.build_windows_x64.result == 'success' && needs.build_android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows x64 EXE and Android armv7 APK build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify target assets, add versioned names, and create checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          test -d release-assets
          test -s release-assets/rustdesk.exe
          test -s release-assets/rustdesk-armv7.apk
          mv release-assets/rustdesk.exe "release-assets/rustdesk-${RELEASE_VERSION}.exe"
          mv release-assets/rustdesk-armv7.apk "release-assets/rustdesk-${RELEASE_VERSION}-armv7.apk"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 2
          (cd release-assets && find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.apk' \) -print0 | xargs -0 sha256sum > SHA256SUMS.txt)
          test -s release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rdgen-rustdesk-${{ needs.detect.outputs.version }}
          name: RustDesk ${{ needs.detect.outputs.version }} — Windows x64 EXE and Android armv7 APK
          target_commitish: ${{ github.sha }}
          body: |
            Built from the RustDesk version that RDGen upstream currently lists as supported.

            - Windows x64: portable EXE only
            - Android: armv7 APK only
            - RDGen upstream commit at detection time: `${{ needs.detect.outputs.upstream_sha }}`

            The saved client settings are embedded from the `rustdesk` GitHub Environment and the custom payload is Ed25519-signed.
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
